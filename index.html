<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100b19">
<title>Para Lorena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,serif;background:#100b19;color:#fff}
#app{position:relative;width:100%;height:100%;overflow:hidden;
background:linear-gradient(180deg,#090a19 0%,#171027 38%,#47202a 70%,#a34b25 100%)}
.glow{position:absolute;inset:0;background:
radial-gradient(ellipse at 50% 78%,rgba(255,202,105,.55) 0,rgba(255,137,45,.22) 14%,transparent 38%),
radial-gradient(ellipse at 50% 105%,rgba(255,100,25,.24),transparent 45%)}
.sun{position:absolute;left:50%;top:76%;width:145px;height:145px;transform:translate(-50%,-50%);
border-radius:50%;background:radial-gradient(circle,#fff7c9,#ffd36b 35%,#ff963b 62%,transparent 70%);
filter:blur(.5px);opacity:.72}
#intro{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
background:linear-gradient(180deg,#08091a,#251329 68%,#743324);transition:1.1s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro{padding:28px}.eyebrow{font:11px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;opacity:.65}
.intro h1{font-size:46px;font-weight:400;margin:14px 0 8px;text-shadow:0 0 28px rgba(255,180,75,.4)}
.intro p{font:14px Arial,sans-serif;opacity:.68;margin:0 0 28px}
button{border:1px solid rgba(255,211,125,.65);border-radius:999px;padding:14px 34px;
background:rgba(255,160,55,.13);color:#ffe7ad;font-size:14px;letter-spacing:1px}
#scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.heart{position:relative;width:min(91vw,430px);height:min(91vw,430px);animation:beat 3.2s ease-in-out infinite}
.word{position:absolute;font:700 clamp(7px,2.05vw,11px) Arial,sans-serif;letter-spacing:.2px;
white-space:nowrap;transform:translate(-50%,-50%);animation:twinkle 3.5s ease-in-out infinite}
.center{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);
font-size:clamp(35px,11vw,60px);font-weight:400;letter-spacing:2px;color:#ffe8aa;
text-shadow:0 0 12px #ffb34d,0 0 35px rgba(255,121,28,.65);animation:centerbeat 3.2s ease-in-out infinite}
.message{position:absolute;z-index:10;bottom:7%;width:90%;left:5%;text-align:center;
font-size:15px;line-height:1.65;color:rgba(255,239,208,.86);opacity:0;transition:2s}
.message.show{opacity:1}
.particle{position:absolute;border-radius:50%;background:#ffd67d;box-shadow:0 0 8px #ffae4b;animation:rise linear infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes centerbeat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}
@keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1;text-shadow:0 0 8px currentColor}}
@keyframes rise{from{transform:translateY(20px);opacity:0}15%{opacity:.55}to{transform:translateY(-110vh);opacity:0}}
@media(max-height:650px){.heart{width:78vw;height:78vw}.message{bottom:3%}}
</style>
</head>
<body>
<div id="app">
<div class="glow"></div><div class="sun"></div><div id="particles"></div>
<section id="intro"><div class="intro">
<div class="eyebrow">eu fiz uma coisa pra você</div>
<h1>Lorena</h1><p>toque para entrar</p><button id="enter">abrir</button>
</div></section>
<main id="scene"><div class="heart" id="heart"></div><div class="center">Lorena</div>
<div class="message" id="message">Algumas coisas a gente não consegue explicar.<br>Só sente.</div></main>
<audio id="music" preload="auto"><source src="always.mp3" type="audio/mpeg"></audio>
</div>
<script>
const heart=document.getElementById('heart');
const colors=['#ffe5a3','#ffd078','#ffb34d','#ff9438','#f6c65b','#fff0bd','#e98736','#ffab43'];
const n=330;
function insideHeart(x,y){
  const X=x*1.25, Y=-y*1.25;
  return Math.pow(X*X+Y*Y-1,3)-X*X*Math.pow(Y,3)<=0;
}
let made=0;
while(made<n){
  let x=Math.random()*2.5-1.25, y=Math.random()*2.5-1.25;
  if(!insideHeart(x,y)) continue;
  const w=document.createElement('span'); w.className='word'; w.textContent='LORENA';
  w.style.left=(50+x*38)+'%'; w.style.top=(50+y*38)+'%';
  w.style.color=colors[Math.floor(Math.random()*colors.length)];
  w.style.animationDelay=(Math.random()*3.5)+'s';
  w.style.opacity=(.48+Math.random()*.45).toFixed(2);
  heart.appendChild(w); made++;
}
const particles=document.getElementById('particles');
for(let i=0;i<38;i++){
  const p=document.createElement('i'); p.className='particle';
  const s=1+Math.random()*3; p.style.width=s+'px'; p.style.height=s+'px';
  p.style.left=Math.random()*100+'%'; p.style.top=(65+Math.random()*45)+'%';
  p.style.animationDuration=(7+Math.random()*9)+'s'; p.style.animationDelay=(-Math.random()*12)+'s';
  particles.appendChild(p);
}
const intro=document.getElementById('intro'), music=document.getElementById('music'), msg=document.getElementById('message');
document.getElementById('enter').addEventListener('click',async()=>{
  try{music.volume=.55; await music.play();}catch(e){}
  intro.classList.add('hide');
  setTimeout(()=>msg.classList.add('show'),139000);
});
document.getElementById('app').addEventListener('pointerdown',e=>{
  if(e.target.id==='enter') return;
  const h=document.createElement('div'); h.textContent='♥';
  h.style.cssText=`position:absolute;z-index:25;left:${e.clientX}px;top:${e.clientY}px;color:#ffd47a;
  font-size:${14+Math.random()*15}px;pointer-events:none;text-shadow:0 0 10px #ff9d3c;
  animation:rise 2.2s linear forwards`;
  document.getElementById('app').appendChild(h); setTimeout(()=>h.remove(),2300);
});
</script>
</body>
</html>
